# Tests and checks on every push and pull request, then (job "bundle") the combined application for hands-on
# testing: FaceRecognizer.exe built from facial-recognition/ plus the journal, as one artifact that
# deploy/deploy_local.ps1 installs on a test computer. No personal data exists in the repository; tests use
# simulated people (fusion/simulate.py).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Python checker (ruff)"
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest tests -q

  face-recognizer:
    # The face recognizer (facial-recognition/, a subtree of its own repository): the same checks it runs there.
    # Its models (Git LFS) aren't needed: its tests use no models.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facial-recognition/face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Browser code tests and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93
      - name: "Python checker (ruff)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q

  # The combined application, once both sets of checks pass: FaceRecognizer.exe (built with the face recognizer's
  # own build_exe.py, as its repository's CI and build_app.bat do), the journal's code, the launchers in deploy/,
  # what was built (BUILD-INFO.json) and every file's SHA-256 (SHA256SUMS.txt, checked by deploy_local.ps1).
  # Kept 14 days. Built for pull requests too; deploy_local.ps1 installs only green pushes to main.
  bundle:
    needs: [checks, face-recognizer]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          lfs: false          # the .exe downloads its models on first start; the bundle carries none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facial-recognition/face-recognizer/requirements*.txt
      - name: Build FaceRecognizer.exe
        working-directory: facial-recognition/face-recognizer
        run: |
          pip install -r requirements-build.txt
          python build_exe.py --no-copy
      - name: Assemble the bundle
        shell: pwsh
        run: |
          $b = "bundle"
          New-Item -ItemType Directory -Force "$b/journal" | Out-Null
          Copy-Item facial-recognition/face-recognizer/build/dist/FaceRecognizer.exe $b
          Copy-Item fusion, tools, docs -Recurse -Destination "$b/journal"
          Copy-Item requirements.txt, README.md, LICENSE, PROJECT_CONTEXT.md "$b/journal"
          Copy-Item deploy/Start-FaceRecognizer.cmd, deploy/Run-FusionDemo.cmd, deploy/README-TEST.txt $b
          Get-ChildItem $b -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          $ver = (Select-String -Path facial-recognition/face-recognizer/app.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          @{ project = "experience-journal"; commit = "${{ github.sha }}"; ref = "${{ github.ref_name }}";
             event = "${{ github.event_name }}"; run = "${{ github.run_id }}"; faceRecognizer = $ver;
             built = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json | Set-Content "$b/BUILD-INFO.json"
          $root = (Resolve-Path $b).Path
          Get-ChildItem $b -Recurse -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.FullName.Substring($root.Length + 1).Replace('\', '/'))"
          } | Set-Content "$b/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: experience-journal-bundle
          path: bundle/
          retention-days: 14
          if-no-files-found: error

# Tests and checks on every push and pull request. No personal data exists in the repository; tests use
# simulated people (fusion/simulate.py).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Python checker (ruff)"
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest tests -q

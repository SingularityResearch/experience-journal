# Runs the tests and checkers on every push and pull request, then builds FaceRecognizer.exe (job "build").
# Light on purpose: no Git LFS download (models and data aren't needed: the tests use a made-up data folder,
# local test servers and no models), no camera, no network beyond installing packages.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved to other code); the comment names the release.

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"
      - name: Browser code tests (expression.js, signals.js, settings_bridge.js) and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        # headless OpenCV on Linux; the app itself uses opencv-contrib-python (requirements.txt)
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93
      - name: "Python checker (ruff, with the pyflakes rules; ruff.toml)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q

  # FaceRecognizer.exe, built on Windows with the same script as build_app.bat (build_exe.py), once the checks pass.
  # Kept 14 days as a build artifact for testing; releases are still made by hand (zip with README.txt, AGENTS.md).
  build:
    needs: checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          lfs: false          # the .exe carries code and pages only; it downloads its models on first start
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: face-recognizer/requirements*.txt
      - name: Install build requirements
        run: pip install -r requirements-build.txt
      - name: Build FaceRecognizer.exe
        run: python build_exe.py --no-copy
      - name: Note what was built
        shell: pwsh
        run: |
          $exe = "build/dist/FaceRecognizer.exe"
          @{ project = "facial-recognition"; commit = "${{ github.sha }}"; ref = "${{ github.ref_name }}";
             run = "${{ github.run_id }}"; built = (Get-Date).ToUniversalTime().ToString("o");
             sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() } |
            ConvertTo-Json | Set-Content build/dist/BUILD-INFO.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: FaceRecognizer-exe
          path: |
            face-recognizer/build/dist/FaceRecognizer.exe
            face-recognizer/build/dist/BUILD-INFO.json
          retention-days: 14
          if-no-files-found: error

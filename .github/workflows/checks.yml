# Tests and checks on every push and pull request. No personal data exists in the repository; tests use
# simulated people (fusion/simulate.py).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Python checker (ruff)"
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest tests -q

  face-recognizer:
    # The face recognizer (facial-recognition/, a subtree of its own repository): the same checks it runs there.
    # Its models (Git LFS) aren't needed: its tests use no models.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facial-recognition/face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Browser code tests and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93
      - name: "Python checker (ruff)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q

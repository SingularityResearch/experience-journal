# Runs the tests and checkers on every push and pull request.
# Light on purpose: no Git LFS download (models and data aren't needed: the tests use a made-up data folder,
# local test servers and no models), no camera, no network beyond installing packages.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser code tests (expression.js, signals.js, settings_bridge.js) and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        # headless OpenCV on Linux; the app itself uses opencv-contrib-python (requirements.txt)
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93
      - name: "Python checker (ruff, with the pyflakes rules; ruff.toml)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q
